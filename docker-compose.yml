services:
  db:
    image: postgres:16-alpine
    container_name: ankkata_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ankkata}
      POSTGRES_USER: ${DB_USER:-ankkata}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ankkata_secret}
    ports:
      # Exposé publiquement sur le port 4003 (choix explicite du déploiement
      # sur 31.97.55.208) — voir DEPLOYMENT.md. ATTENTION : PostgreSQL est
      # alors joignable depuis tout Internet sur ce port. Un DB_PASSWORD
      # fort dans .env est donc IMPÉRATIF (pas la valeur par défaut du
      # dépôt). Envisagez de restreindre ce port par IP source dans le
      # pare-feu du VPS (ufw) si vous connaissez les IP qui doivent y
      # accéder.
      - "4003:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ankkata} -d ${DB_NAME:-ankkata}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ankkata_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ankkata_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ankkata}
      DB_USER: ${DB_USER:-ankkata}
      DB_PASSWORD: ${DB_PASSWORD:-ankkata_secret}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-ankkata_dev_jwt_secret_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-ankkata_dev_refresh_secret_change_me}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
      LATEST_APP_VERSION: ${LATEST_APP_VERSION:-1.0.0}
    ports:
      # Exposé publiquement sur le port 4002 — l'API est directement
      # joignable sur http://31.97.55.208:4002/api/v1, sans passer par
      # Caddy/HTTPS (choix explicite de ce déploiement, voir DEPLOYMENT.md).
      - "4002:4000"
    volumes:
      - uploads:/usr/src/app/uploads
    networks:
      - ankkata_net

  adminer:
    image: adminer:latest
    container_name: ankkata_adminer
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      # Exposé publiquement sur le port 4004 — http://31.97.55.208:4004.
      # Adminer donne un accès direct à la base de données via son
      # interface web : protégez-vous au moins avec un mot de passe DB fort
      # (voir service "db" ci-dessus) tant qu'aucune authentification
      # supplémentaire n'est ajoutée devant.
      - "4004:8080"
    networks:
      - ankkata_net

  # Reverse proxy + HTTPS automatique (Let's Encrypt) — NON UTILISÉ dans ce
  # déploiement (API/DB/Adminer exposés directement sur 4002/4003/4004, voir
  # ci-dessus). Laissé ici, inactif par défaut (`profiles: [prod]`), pour le
  # jour où vous voudrez passer sur un nom de domaine + HTTPS — voir
  # DEPLOYMENT.md.
  caddy:
    image: caddy:2-alpine
    container_name: ankkata_caddy
    restart: unless-stopped
    profiles:
      - prod
    depends_on:
      - api
    environment:
      ANKKATA_DOMAIN: ${ANKKATA_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ankkata_net

networks:
  ankkata_net:
    driver: bridge

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
